<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopping Cart</title>
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box;}
    body {font-family: Arial; background: #f5f5f5;}
    .header {
      background: #333; color: white;
      padding: 20px; display: flex;
      justify-content: space-between; align-items: center;
    }
    .cart-icon {position: relative; cursor: pointer;}
    .cart-count {
      position: absolute; top: -10px; right: -10px;
      background: red; color: white; border-radius: 50%;
      width: 22px; height: 22px; display: flex;
      justify-content: center; align-items: center;
      font-size: 12px;
    }
    .container {max-width: 1000px; margin: 0 auto; padding: 20px;}
    .products-grid {
      display: grid; grid-template-columns: repeat(auto-fill,minmax(200px,1fr));
      gap: 20px; margin-bottom: 30px;
    }
    .product-card {
      background: white; padding: 20px; border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center;
    }
    .product-image {font-size: 70px; margin-bottom: 10px;}
    .product-name {font-size: 18px; font-weight: bold;}
    .product-price {color: #28a745; font-size: 18px; margin: 5px 0 15px;}
    .add-to-cart-btn {
      background: #007bff; color: white; border: none;
      padding: 10px; border-radius: 5px; cursor: pointer; width: 100%;
    }
    .add-to-cart-btn:hover {background: #0056b3;}
    .cart-section {
      background: white; padding: 20px; border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #eee; padding: 10px 0;
    }
    .quantity-controls {display: flex; align-items: center; gap: 10px;}
    .quantity-controls button {
      width: 28px; height: 28px; border: 1px solid #ccc;
      background: white; cursor: pointer; border-radius: 5px;
    }
    .cart-total {
      text-align: right; font-size: 20px; font-weight: bold; padding-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>DyNien Shop</h1>
    <div class="cart-icon" onclick="toggleCart()">
      🛒 Cart <span class="cart-count" id="cartCount">0</span>
    </div>
  </div>

  <div class="container">
    <h2>Products</h2>
    <div class="products-grid" id="productsGrid"></div>

    <div class="cart-section" id="cartSection" style="display:none;">
      <h2>Shopping Cart</h2>
      <div id="cartItems"></div>
      <div class="cart-total">
        Total: $<span id="cartTotal">0.00</span>
      </div>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: 'Laptop', price: 999.99, image: '💻' },
      { id: 2, name: 'Smartphone', price: 699.99, image: '📱' },
      { id: 3, name: 'Headphones', price: 199.99, image: '🎧' },
      { id: 4, name: 'Smartwatch', price: 299.99, image: '⌚' }
    ];

    let cart = [];

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existing = cart.find(item => item.id === productId);
      if (existing) {
        existing.quantity++;
      } else {
        cart.push({ ...product, quantity: 1 });
      }
      renderCart();
    }

    function removeFromCart(itemId) {
      cart = cart.filter(item => item.id !== itemId);
      renderCart();
    }

    function updateQuantity(productId, change) {
      const item = cart.find(i => i.id === productId);
      if (!item) return;
      item.quantity += change;
      if (item.quantity <= 0) removeFromCart(productId);
      renderCart();
    }

    function calculateTotal() {
      return cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <div class="product-image">${p.image}</div>
          <div class="product-name">${p.name}</div>
          <div class="product-price">$${p.price.toFixed(2)}</div>
          <button class="add-to-cart-btn" onclick="addToCart(${p.id})">Add to Cart</button>
        </div>
      `).join('');
    }

    function renderCart() {
      const cartItems = document.getElementById('cartItems');
      const cartCount = document.getElementById('cartCount');
      const cartTotal = document.getElementById('cartTotal');

      cartItems.innerHTML = cart.map(item => `
        <div class="cart-item">
          <span>${item.image} ${item.name} - $${item.price.toFixed(2)}</span>
          <div class="quantity-controls">
            <button onclick="updateQuantity(${item.id}, -1)">-</button>
            <span>${item.quantity}</span>
            <button onclick="updateQuantity(${item.id}, 1)">+</button>
            <button onclick="removeFromCart(${item.id})">Remove</button>
          </div>
        </div>
      `).join('');

      cartCount.textContent = cart.reduce((count, i) => count + i.quantity, 0);
      cartTotal.textContent = calculateTotal().toFixed(2);
    }

    function toggleCart() {
      const section = document.getElementById('cartSection');
      section.style.display = section.style.display === 'none' ? 'block' : 'none';
    }

    renderProducts();
  </script>
</body>
</html>
